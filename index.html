const PAGES=[{"id":"home","nav":"Home","kicker":"LANGUAGE AS MEASURABLE MATERIAL","title":"The market<br>for <span class='accent'>meaning.</span>","body":"A living laboratory for observing character demand, appraising sentences, and keeping the evidence behind every experimental value visible.","next":"alphabet"},{"id":"alphabet","nav":"Alphabet","kicker":"01 / LIVE LETTERS","title":"The alphabet,<br>repriced.","body":"Observe reference values and demand movement across the current corpus.","endpoint":"/ticker","cards":[["LIVE MODEL","Letter ticker","Reference values refresh from sampled public text."],["44 PRIMITIVES","Expanded alphabet","Letters, digits, spaces, and punctuation become inspectable units."],["TRUTH LABEL","Not an exchange","Values are experimental appraisals, not offers or liquidity."]]},{"id":"appraise","nav":"Appraise","kicker":"02 / SENTENCE INSTRUMENT","title":"Measure a<br>sentence.","body":"Submit text to the appraisal surface and inspect its material composition.","endpoint":"/sentences/validate","input":true,"bodyKey":"sentence","placeholder":"Enter a sentence to appraise…","cards":[["COMPOSITION","Primitive cost","Break text into its priced character components."],["EVIDENCE","Formula visible","Keep frequency, floor, demand, and rarity terms inspectable."],["DEVNET","Experimental only","No displayed value represents a tradeable asset."]]},{"id":"sources","nav":"Sources","kicker":"03 / SOURCE LEDGER","title":"Where the model<br>looks.","body":"Inspect connected public sources, contribution counts, and freshness.","endpoint":"/corpus/snapshot","cards":[["PROVENANCE","Named inputs","Every connected source is declared."],["FRESHNESS","Refresh state","Availability and update time remain visible."],["FAILURE","Silence is data","Unavailable sources appear unavailable—not simulated."]]},{"id":"method","nav":"Method","kicker":"04 / APPRAISAL METHOD","title":"A number with<br>a memory.","body":"The published model compares observed frequency with the declared baseline.","endpoint":"/kpi/live","cards":[["FLOOR","Minimum term","A declared experimental base value."],["DEMAND","Corpus ratio","Observed frequency divided by the English baseline."],["RARITY","Scarcity term","A visible adjustment, not a hidden model judgment."]]},{"id":"status","nav":"Status","kicker":"05 / SYSTEM STATE","title":"Verify before<br>relying.","body":"Read the public service state directly from the running API.","endpoint":"/health","cards":[["HEALTH","Service reachability","A real response from the deployed backend."],["CORPUS","Sampling state","The public site depends on connected-source availability."],["SOURCE","Open implementation","Inspect and challenge the contract on GitHub."]]}];const API_KEY='language_api';const DEFAULT_API='https://language-fi.vercel.app/api';
const app=document.getElementById('app');const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function api(){return localStorage.getItem(API_KEY)||DEFAULT_API}function route(){return location.hash.slice(1)||'home'}function nav(id){location.hash=id}
async function call(path,opts){const out=$('#output');if(out)out.textContent='Requesting '+api()+path+' …';try{const r=await fetch(api()+path,opts);const text=await r.text();let v;try{v=JSON.parse(text)}catch{v=text}if(out)out.textContent=JSON.stringify(v,null,2);const dot=$('#liveDot');if(dot)dot.classList.toggle('live',r.ok)}catch(e){if(out)out.textContent='Unavailable: '+e.message+'\n\nCheck the API base, deployment state, and CORS policy.'}}
function cards(items){return '<div class="grid">'+items.map(x=>'<article class="card"><div class="mono">'+esc(x[0])+'</div><h3>'+esc(x[1])+'</h3><p>'+esc(x[2])+'</p></article>').join('')+'</div>'}
function consoleBox(page){return '<div class="console"><div class="consolebar"><span>'+esc(page.endpoint||'API CONSOLE')+'</span><span class="status"><i class="dot" id="liveDot"></i> LIVE WHEN AVAILABLE</span></div><div class="consolebody">'+(page.input?'<div class="form"><textarea id="payload" class="input" rows="4" placeholder="'+esc(page.placeholder||'Enter text')+'"></textarea><button class="btn primary" id="run">Run endpoint →</button></div><pre id="output" style="margin-top:18px">Ready.</pre>':'<button class="btn primary" id="run">Fetch live endpoint →</button><pre id="output" style="margin-top:18px">Ready.</pre>')+'</div></div>'}
function render(){const id=route();const p=PAGES.find(x=>x.id===id)||PAGES[0];document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===p.id));if(p.id==='home'){app.innerHTML='<section class="shell hero"><div><div class="eyebrow">'+esc(p.kicker)+'</div><h1>'+p.title+'</h1><p class="lead">'+esc(p.body)+'</p><div class="actions"><button class="btn primary" data-go="'+esc(p.next)+'">Enter the system →</button><a class="btn" href="https://github.com/overandor/language-fi">Inspect source ↗</a></div></div><div class="art" aria-label="Language.fi visual artwork"></div></section>';document.querySelector('[data-go]').onclick=e=>nav(e.currentTarget.dataset.go);return}app.innerHTML='<section class="shell"><div class="pagehead"><div class="eyebrow">'+esc(p.kicker)+'</div><h2>'+p.title+'</h2><p class="lead">'+esc(p.body)+'</p></div><div class="content">'+cards(p.cards)+consoleBox(p)+'</div></section>';$('#run').onclick=()=>{let opts;if(p.input){opts={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p.bodyKey?{[p.bodyKey]:$('#payload').value}:{text:$('#payload').value})}}call(p.endpoint,opts)}}
document.querySelectorAll('[data-page]').forEach(a=>a.onclick=()=>nav(a.dataset.page));window.addEventListener('hashchange',render);render();
</script></body></html>
