version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: language-fi-postgres
    environment:
      POSTGRES_DB: languagefi
      POSTGRES_USER: languagefi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U languagefi_user -d languagefi"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: language-fi-worker
    environment:
      DATABASE_URL: postgresql://languagefi_user:${POSTGRES_PASSWORD}@postgres:5432/languagefi
      GATEIO_API_BASE: ${GATEIO_API_BASE}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL}
      ORACLE_PRIVATE_KEY: ${ORACLE_PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
